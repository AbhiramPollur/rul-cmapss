[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rul-cmapss"
version = "0.1.0"
description = "Remaining Useful Life prediction on NASA C-MAPSS with LightGBM and conformal prediction intervals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "abpol" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mapie>=1.0",
    "joblib>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "evidently>=0.7",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let pytest import the package from src/ without an editable install,
# so `pytest` works both locally and in CI even before `pip install -e .`.
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# EDA notebooks use plotting idioms (trailing semicolons) that aren't worth
# linting; the library and tests are the linted surface.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
