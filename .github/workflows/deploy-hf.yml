name: Deploy to Hugging Face Spaces

# Deploys the FastAPI service to a Docker Space on Hugging Face.
#
# One time setup (nothing here runs until these are in place):
#   1. Create a free Hugging Face account, then a new Space with SDK "Docker"
#      and the "Blank" template. Name it however you like, e.g. rul-cmapss.
#   2. Create a Hugging Face access token with the "write" role
#      (https://huggingface.co/settings/tokens).
#   3. In this GitHub repo, add:
#        - a secret   named HF_TOKEN  set to that token
#        - a variable named HF_SPACE  set to "<your-hf-username>/<space-name>"
#      (Settings > Secrets and variables > Actions).
#
# After that, every push to main redeploys, and you can also trigger it by hand
# from the Actions tab. Until then the job runs green and simply skips.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment is configured
        id: cfg
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN or HF_SPACE is not set, so there is nothing to deploy yet."
            echo "See the header of this workflow file for the one time setup."
          fi

      - name: Checkout
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Add Space metadata to the README
        if: steps.cfg.outputs.ready == 'true'
        # Hugging Face reads Space config from YAML front matter at the top of
        # README.md. We inject it here so the copy on GitHub stays clean and the
        # copy on the Space carries the metadata it needs. app_port matches the
        # port uvicorn listens on inside the container (see Dockerfile).
        run: |
          {
            echo "---"
            echo "title: RUL C-MAPSS API"
            echo "emoji: 🛩️"
            echo "colorFrom: blue"
            echo "colorTo: gray"
            echo "sdk: docker"
            echo "app_port: 8000"
            echo "pinned: false"
            echo "---"
            echo ""
            cat README.md
          } > README.hf.md
          mv README.hf.md README.md

      - name: Push a clean snapshot to the Space
        if: steps.cfg.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        # A single orphan commit ships the current tree only, so the Space never
        # inherits repository history or any file that used to live in it.
        run: |
          owner="${HF_SPACE%%/*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git add -A
          git commit -m "Deploy RUL C-MAPSS service"
          git push --force "https://${owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" deploy:main
          echo "Deployed. Your Space: https://huggingface.co/spaces/${HF_SPACE}"
